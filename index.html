:root {
  --bg: #07090D; --bg2: #0D1118; --card: #121722; --card2: #1A2030; --line: #242C3B; --line2: #313A4C;
  --text: #F3F5F9; --muted: #8A93A6; --faint: #5C6578;
  --gold: #F6B547; --gold2: #FFD98F; --gold-ink: #1A1206;
  --ok: #3DDC97; --ok-soft: rgba(61, 220, 151, .14); --miss: #FF8A5B; --miss-soft: rgba(255, 138, 91, .14); --danger: #FF5C64;
  --fig: #F3F5F9; --fig-far: #4E586C; --prop: #8C9AC2; --prop-soft: #2A3346;
  --glass: rgba(10, 13, 19, .72); --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --body: 'Barlow', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --skin-l: #EEF1F5; --skin-d: #98A1B1; --skin-far-l: #8A93A4; --skin-far-d: #5A6375; --skin-edge: rgba(0, 0, 0, .35);
  --mus-l: #FF6E58; --mus-d: #D12C1F; --shoe: #2B313D; --shoe-far: #1E232C; --floor-shadow: rgba(0, 0, 0, .6);
  --iron: #262C37; --iron-rim: #6F7A92; --stage-a: #1E2533; --stage-b: #0C1018;
  --tabh: 64px; color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #F3F4F7; --bg2: #ECEEF2; --card: #FFFFFF; --card2: #F2F4F7; --line: #E3E6EC; --line2: #D3D8E1;
  --text: #0D1220; --muted: #626C80; --faint: #98A0B0;
  --gold: #C98712; --gold2: #F6B547; --gold-ink: #FFFFFF;
  --ok: #10A06A; --ok-soft: rgba(16, 160, 106, .12); --miss: #DD6431; --miss-soft: rgba(221, 100, 49, .12);
  --fig: #0D1220; --fig-far: #B5BCC9; --prop: #4F5E86; --prop-soft: #DCE1EB;
  --glass: rgba(243, 244, 247, .8); --shadow: 0 10px 30px rgba(20, 30, 60, .12);   --skin-far-l: #C2C8D2; --skin-far-d: #8E97A8; --skin-edge: rgba(20, 30, 50, .3); --floor-shadow: rgba(20, 30, 60, .22); --stage-a: #F1F3F7; --stage-b: #CDD4DF; --prop-soft: #D5DBE5; color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #F3F4F7; --bg2: #ECEEF2; --card: #FFFFFF; --card2: #F2F4F7; --line: #E3E6EC; --line2: #D3D8E1;
  --text: #0D1220; --muted: #626C80; --faint: #98A0B0;
  --gold: #C98712; --gold2: #F6B547; --gold-ink: #FFFFFF;
  --ok: #10A06A; --ok-soft: rgba(16, 160, 106, .12); --miss: #DD6431; --miss-soft: rgba(221, 100, 49, .12);
  --fig: #0D1220; --fig-far: #B5BCC9; --prop: #4F5E86; --prop-soft: #DCE1EB;
  --glass: rgba(243, 244, 247, .8); --shadow: 0 10px 30px rgba(20, 30, 60, .12);   --skin-far-l: #C2C8D2; --skin-far-d: #8E97A8; --skin-edge: rgba(20, 30, 50, .3); --floor-shadow: rgba(20, 30, 60, .22); --stage-a: #F1F3F7; --stage-b: #CDD4DF; --prop-soft: #D5DBE5; color-scheme: light; }

/* day colours (bumper-plate inspired) */
.d0 { --dA: #E5484D; --dB: #7E1A27; } .d1 { --dA: #3E7BFA; --dB: #142C6E; } .d2 { --dA: #E9B13A; --dB: #7A4E06; }
.d3 { --dA: #2FC18B; --dB: #0B5A40; } .d4 { --dA: #A9B4C4; --dB: #3D4757; } .d5 { --dA: #5A6478; --dB: #151A24; } .d6 { --dA: #8E7CF0; --dB: #33267F; }

html { height: 100%; }
html, body { background: var(--bg); overscroll-behavior: none; }
body { height: 100%; margin: 0; overflow: hidden; color: var(--text); font: 400 16px/1.45 var(--body); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
:where(button, a.btn) { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; touch-action: manipulation; -webkit-user-select: none; user-select: none; text-decoration: none; }
button:focus-visible, a:focus-visible { outline: 2.5px solid var(--gold); outline-offset: 2px; }
button:disabled { opacity: .35; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
svg { width: 20px; height: 20px; flex: none; }

#app { position: fixed; top: 0; right: 0; bottom: 0; left: 0; width: 100%; max-width: 560px; margin: 0 auto; overflow: hidden; background: var(--bg); }
.stack { position: absolute; top: env(safe-area-inset-top, 0px); right: 0; bottom: 0; left: 0; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; padding-inline: 16px; padding-block: 8px 28px; display: flex; flex-direction: column; gap: 18px; }
.scroll > * { flex: none; }
.tab-screen .scroll { padding-bottom: calc(var(--tabh) + 28px + env(safe-area-inset-bottom, 0px)); }
.push-screen .scroll { padding-bottom: 120px; }

/* transitions */
.in-push { animation: inPush .34s cubic-bezier(.2, .8, .2, 1) both; box-shadow: -12px 0 30px rgba(0, 0, 0, .35); z-index: 2; }
.under { animation: under .34s cubic-bezier(.2, .8, .2, 1) both; }
.in-pop { animation: inPop .3s cubic-bezier(.2, .8, .2, 1) both; }
.out-pop { animation: outPop .3s cubic-bezier(.2, .8, .2, 1) both; z-index: 2; }
.in-fade { animation: fade .22s ease both; }
@keyframes inPush { from { transform: translateX(100%); } }
@keyframes under { to { transform: translateX(-25%); opacity: .6; } }
@keyframes inPop { from { transform: translateX(-25%); opacity: .6; } }
@keyframes outPop { to { transform: translateX(100%); } }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } }

/* large title */
.lt { padding-top: 14px; display: grid; gap: 2px; }
.lt-eyebrow { color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.lt-title { font: 800 40px/1 var(--display); letter-spacing: -.005em; text-transform: uppercase; }

/* nav bar for pushed screens */
.navbar { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 52px; padding-inline: 8px; background: var(--glass); -webkit-backdrop-filter: blur(18px) saturate(1.6); backdrop-filter: blur(18px) saturate(1.6); border-bottom: 1px solid var(--line); position: relative; z-index: 3; }
.nb-back { display: inline-flex; align-items: center; gap: 2px; color: var(--gold); font-weight: 600; font-size: 16px; padding: 10px 8px; width: max-content; }
.nb-back svg { width: 22px; height: 22px; }
.nb-title { font: 700 17px var(--display); text-transform: uppercase; letter-spacing: .06em; }
.nb-spacer { width: 1px; }

/* tab bar */
.tabbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; display: grid; grid-template-columns: repeat(3, 1fr); padding: 6px 12px calc(6px + env(safe-area-inset-bottom, 0px)); background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6); border-top: 1px solid var(--line); }
.tab { display: grid; justify-items: center; gap: 2px; padding: 6px 0; color: var(--faint); font-size: 11px; font-weight: 600; letter-spacing: .02em; }
.tab svg { width: 26px; height: 26px; }
.tab.on { color: var(--gold); }

/* segmented control */
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
.seg-btn { display: grid; gap: 0; padding: 9px 12px; border-radius: 12px; color: var(--muted); transition: background .2s, color .2s; }
.seg-btn b { font: 700 18px/1.1 var(--display); text-transform: uppercase; letter-spacing: .03em; }
.seg-btn span { font-size: 12px; }
.seg-btn.on { background: var(--card2); color: var(--text); box-shadow: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 4px 12px rgba(0, 0, 0, .25); }
.seg-btn.on b { color: var(--gold); }

/* hero */
.hero, .dhero { position: relative; overflow: hidden; border-radius: 26px; color: #fff; isolation: isolate; background: linear-gradient(150deg, var(--dA), var(--dB)); box-shadow: var(--shadow); }
.dhero { border-radius: 24px; min-height: 210px; display: flex; align-items: flex-end; }
.hero-fig { position: absolute; right: -2%; top: 0; width: 40%; height: 40%; z-index: -1; opacity: .95; }
.dhero .hero-fig { top: 4%; height: 66%; width: 50%; }
.hero-bg { position: absolute; inset: 0; background-size: cover; background-position: center 30%; opacity: .28; mix-blend-mode: luminosity; z-index: -1; filter: contrast(1.1); }
.hero::after, .dhero::after { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(0, 0, 0, 0) 20%, rgba(0, 0, 0, .55) 100%); }
.hero-body { padding: 22px 20px 20px; display: grid; gap: 8px; width: 100%; }
.hero { min-height: 280px; display: flex; align-items: flex-end; }
.hero-day { font-size: 12.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; opacity: .85; }
.hero-title { font: 800 44px/.95 var(--display); text-transform: uppercase; letter-spacing: -.005em; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; font-weight: 600; opacity: .92; }
.hero-meta span { display: inline-flex; align-items: center; gap: 6px; }
.hero-meta svg { width: 17px; height: 17px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 20px; border-radius: 16px; font-weight: 700; font-size: 16px; text-align: center; transition: transform .12s, opacity .2s; }
.btn:active { transform: scale(.97); }
.btn-hero { margin-top: 8px; background: #fff; color: #0B0E14; width: 100%; }
.btn-primary { background: linear-gradient(180deg, var(--gold2), var(--gold)); color: #1A1206; }
.btn-ghost { background: var(--card2); color: var(--text); border: 1px solid var(--line); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-wide { width: 100%; }

/* cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 16px; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
.card-head h3 { font: 700 18px var(--display); text-transform: uppercase; letter-spacing: .05em; }
.card-head span { color: var(--muted); font-size: 13.5px; font-weight: 600; }
.week-row { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wd { display: grid; justify-items: center; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 700; }
.wd i { font-style: normal; width: 100%; max-width: 40px; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; background: var(--card2); color: var(--text); font: 700 15px var(--display); font-variant-numeric: tabular-nums; }
.wd.ok i { background: var(--ok); color: #04130C; }
.wd.ok svg { width: 18px; height: 18px; }
.wd.miss i { background: var(--miss-soft); color: var(--miss); }
.wd.is-today span { color: var(--gold); }
.wd.is-today i { box-shadow: 0 0 0 2px var(--gold); }
.stats2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 16px; display: grid; gap: 2px; text-align: left; }
.stat b { font: 800 46px/1 var(--display); font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13.5px; font-weight: 600; }
.stat.ok b { color: var(--ok); } .stat.miss b { color: var(--miss); }
.fine { color: var(--faint); font-size: 12.5px; line-height: 1.5; text-align: center; padding-inline: 8px; }

/* plan list */
.daylist { display: grid; gap: 10px; }
.dayrow { position: relative; display: flex; align-items: center; gap: 14px; padding: 14px 14px 14px 0; background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.dayrow.is-today { border-color: var(--gold); }
.dr-band { align-self: stretch; width: 6px; flex: none; background: linear-gradient(180deg, var(--dA), var(--dB)); }
.dr-main { flex: 1; min-width: 0; display: grid; gap: 1px; }
.dr-day { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; display: flex; gap: 8px; align-items: center; }
.dr-day em { font-style: normal; background: var(--gold); color: #1A1206; padding: 1px 7px; border-radius: 6px; font-size: 10.5px; }
.dr-focus { font: 800 23px/1.05 var(--display); text-transform: uppercase; }
.dr-meta { color: var(--muted); font-size: 13px; }
.dr-chev { color: var(--faint); }
.dr-done { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--ok); color: #04130C; flex: none; }
.dr-done svg { width: 18px; height: 18px; }

/* day screen */
.phase { font-size: 14px; color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; }
.phase b { color: var(--gold); margin-right: 4px; }
.group { display: grid; gap: 10px; }
.group-title { font: 700 15px var(--display); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.group-title span { font: 700 11.5px var(--body); background: var(--card2); color: var(--text); border-radius: 99px; padding: 2px 8px; letter-spacing: 0; }
.rows { background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; }
.row + .row { border-top: 1px solid var(--line); }
.row:active { background: var(--card2); }
.row-thumb { flex: none; width: 84px; }
.row-main { flex: 1; min-width: 0; display: grid; gap: 2px; }
.row-name { font: 700 18px/1.1 var(--display); text-transform: uppercase; letter-spacing: .01em; }
.row-rx { color: var(--muted); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.pips { display: flex; gap: 4px; margin-top: 3px; }
.pips i { width: 16px; height: 4px; border-radius: 4px; background: var(--line2); }
.pips i.on { background: var(--ok); }
.row-end { color: var(--faint); flex: none; }
.okdot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--ok); color: #04130C; }
.okdot svg { width: 16px; height: 16px; }
.row.done .row-name { color: var(--muted); }

/* media */
.media { position: relative; overflow: hidden; border-radius: 14px; background: radial-gradient(120% 90% at 50% 25%, var(--stage-a), var(--stage-b)); }
.media-thumb { aspect-ratio: 4 / 3; border-radius: 12px; }
.media-big { aspect-ratio: 3 / 2; border-radius: 22px; margin-top: 4px; box-shadow: var(--shadow); }
.media canvas { width: 100%; height: 100%; display: block; }
.media.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.media.photo img.b { animation: flip 2.6s infinite; }
@keyframes flip { 0%, 38% { opacity: 0; } 50%, 88% { opacity: 1; } 100% { opacity: 0; } }
.media-tag i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--mus-l); margin-right: 6px; vertical-align: 1px; }
.media-tag { position: absolute; left: 12px; top: 12px; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #fff; background: rgba(0, 0, 0, .5); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); padding: 5px 10px; border-radius: 99px; }

/* exercise screen */
.ex-head { display: grid; gap: 3px; }
.ex-sec { color: var(--gold); font-size: 12.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.ex-head h1 { font: 800 36px/1 var(--display); text-transform: uppercase; }
.ex-tg { color: var(--muted); font-size: 14.5px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; display: grid; gap: 0; }
.tile b { font: 800 30px/1.05 var(--display); font-variant-numeric: tabular-nums; }
.tile span { color: var(--muted); font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.tracker { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 16px; display: grid; gap: 14px; transition: border-color .3s; }
.tracker.complete { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.tr-head { display: flex; align-items: baseline; justify-content: space-between; }
.tr-label { font: 700 15px var(--display); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.tracker.complete .tr-label { color: var(--ok); }
.tr-count { font: 600 15px var(--display); color: var(--muted); font-variant-numeric: tabular-nums; }
.tr-count b { font-size: 22px; color: var(--text); }
.chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(58px, 1fr)); gap: 8px; }
.chip { position: relative; height: 74px; border-radius: 16px; background: var(--card2); border: 1.5px solid var(--line); display: grid; place-content: center; justify-items: center; gap: 1px; overflow: hidden; transition: background .2s, border-color .2s, transform .12s; }
.chip:active { transform: scale(.95); }
.chip-n { font: 800 26px/1 var(--display); color: var(--text); }
.chip-sub { font-size: 11.5px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip .chip-ico { display: none; }
.chip.next { border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 18%, transparent); }
.chip.on { background: var(--ok); border-color: var(--ok); }
.chip.on .chip-n, .chip.on .chip-sub { display: none; }
.chip.on .chip-ico { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: rgba(4, 19, 12, .14); color: #04130C; }
.chip.on .chip-ico svg { width: 20px; height: 20px; }
.chips.single { grid-template-columns: 1fr; }
.chips.single .chip { height: 58px; grid-auto-flow: column; gap: 10px; align-items: center; background: linear-gradient(180deg, var(--gold2), var(--gold)); border: 0; }
.chips.single .chip .chip-ico { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: rgba(26, 18, 6, .15); color: #1A1206; }
.chips.single .chip .chip-ico svg { width: 17px; height: 17px; }
.chips.single .chip-txt { font-weight: 700; font-size: 16px; color: #1A1206; }
.chips.single .chip.next { box-shadow: none; }
.chips.quiet .chip:not(.on) { background: transparent; border: 1.5px dashed var(--line2); height: 48px; }
.chips.quiet .chip:not(.on) .chip-txt { color: var(--muted); font-size: 14.5px; }
.chips.quiet .chip:not(.on) .chip-ico { background: var(--card2); color: var(--muted); }
.chips.single .chip.on { background: var(--ok-soft); border: 1.5px solid var(--ok); }
.chips.single .chip.on .chip-ico { background: var(--ok); color: #04130C; }
.chips.single .chip.on .chip-txt { color: var(--ok); }
.timer { display: flex; align-items: center; gap: 16px; padding: 14px; border-radius: 18px; background: var(--bg2); border: 1px solid var(--line); }
.t-ring { position: relative; width: 104px; height: 104px; flex: none; }
.t-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.t-track { fill: none; stroke: var(--line); stroke-width: 8; }
.t-fill { fill: none; stroke: var(--gold); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
.timer[data-kind="work"] .t-fill { stroke: var(--ok); }
.timer:not(.live) .t-fill { stroke: var(--line2); }
.t-text { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; }
.t-text b { font: 800 30px/1 var(--display); font-variant-numeric: tabular-nums; }
.t-text span { color: var(--muted); font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; margin-top: 2px; }
.timer.live .t-text span { color: var(--gold); }
.timer.live[data-kind="work"] .t-text span { color: var(--ok); }
.t-side { flex: 1; min-width: 0; display: grid; gap: 4px; }
.t-title { font: 700 18px/1.1 var(--display); text-transform: uppercase; letter-spacing: .02em; }
.t-sub { color: var(--muted); font-size: 13px; line-height: 1.35; }
.t-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.btn-sm { min-height: 38px; padding: 0 14px; border-radius: 12px; font-size: 14px; }
.btn-sm svg { width: 15px; height: 15px; }
.how { display: grid; gap: 10px; }
.how ol { margin: 0; padding: 14px 16px 14px 36px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; display: grid; gap: 8px; font-size: 15.5px; }
.how li::marker { color: var(--gold); font-weight: 700; }
.watch svg { width: 16px; height: 16px; }

/* action bar */
.actionbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; align-items: center; gap: 12px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6); border-top: 1px solid var(--line); }
.ab-prog { flex: 1; min-width: 0; display: grid; gap: 6px; }
.ab-prog p { font-size: 13.5px; color: var(--muted); font-weight: 600; }
.ab-prog b { color: var(--ok); }
.meter { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--ok); border-radius: 99px; transition: width .4s; }
.actionbar .btn-primary { min-width: 120px; }
.ex-bar .btn { flex: 1; }

/* calendar */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-head h3 { font: 700 21px var(--display); text-transform: uppercase; letter-spacing: .04em; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--card2); display: grid; place-items: center; color: var(--text); }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.gw { text-align: center; color: var(--faint); font-size: 12px; font-weight: 700; padding-bottom: 2px; }
.gc { aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center; font: 700 16px var(--display); font-variant-numeric: tabular-nums; color: var(--muted); background: var(--card2); }
.gc.empty { background: none; }
.gc.ok { background: var(--ok); color: #04130C; }
.gc.miss { background: var(--miss-soft); color: var(--miss); }
.gc.today { box-shadow: 0 0 0 2px var(--gold); color: var(--text); }
.gc.ok.today { color: #04130C; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 14px; color: var(--muted); font-size: 12.5px; font-weight: 600; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
.lg.ok { background: var(--ok); } .lg.miss { background: var(--miss-soft); box-shadow: inset 0 0 0 1.5px var(--miss); } .lg.today { box-shadow: inset 0 0 0 2px var(--gold); }
.reset { display: grid; gap: 10px; }
.confirm { display: grid; gap: 10px; text-align: center; color: var(--muted); font-size: 14px; }

/* toast */
.toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 20; display: flex; align-items: center; gap: 12px; padding: 12px 18px 12px 12px; border-radius: 18px; background: var(--card2); border: 1px solid var(--ok); box-shadow: var(--shadow); animation: toastIn .35s cubic-bezier(.2, .8, .2, 1); }
.toast > svg { width: 34px; height: 34px; padding: 7px; border-radius: 50%; background: var(--ok); color: #04130C; }
.toast span { display: grid; font-size: 13px; color: var(--muted); }
.toast b { color: var(--text); font-size: 15px; }
.toast.out { opacity: 0; transition: opacity .3s; }
@keyframes toastIn { from { transform: translate(-50%, -20px); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  .in-push, .under, .in-pop, .out-pop, .in-fade, .toast { animation: none !important; }
  .media.photo img.b { animation: none; opacity: 0; }
  * { transition: none !important; }
}

/* ===== Guided player ===== */
.player { --phase: var(--gold); background: var(--bg); padding-bottom: env(safe-area-inset-bottom, 0px); }
.player[data-phase="work"] { --phase: var(--ok); }
.player[data-phase="rest"] { --phase: #6E9BFF; }
.player[data-phase="done"] { --phase: var(--ok); }
.player::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(90% 55% at 50% 0%, color-mix(in srgb, var(--phase) 22%, transparent), transparent 70%); transition: background .5s; }
.pl-top { position: relative; flex: none; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; padding: 8px 12px 6px; }
.pl-icon { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); color: var(--text); }
.pl-icon svg { width: 20px; height: 20px; }
.pl-where { text-align: center; display: grid; line-height: 1.2; }
.pl-where b { font: 700 15px var(--display); text-transform: uppercase; letter-spacing: .12em; color: var(--phase); }
.pl-where span { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.pl-bar { position: relative; flex: none; height: 4px; margin: 4px 16px 0; border-radius: 4px; background: var(--line); overflow: hidden; }
.pl-bar span { display: block; height: 100%; background: var(--phase); border-radius: 4px; transition: width .4s; }
.pl-body { position: relative; flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: stretch; gap: 14px; padding: 14px 16px 8px; }
.pl-body > * { flex: none; }
.pl-stage .media-big { aspect-ratio: 16 / 11; margin: 0; }
.pl-info { text-align: center; display: grid; gap: 2px; }
.pl-phase { font: 800 15px var(--display); text-transform: uppercase; letter-spacing: .16em; color: var(--phase); }
.pl-info h1 { font: 800 32px/1 var(--display); text-transform: uppercase; }
.pl-rx { color: var(--muted); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.pl-dial { position: relative; width: min(54vw, 210px); aspect-ratio: 1; margin: 0 auto; }
.pl-dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.pd-track { fill: none; stroke: var(--line); stroke-width: 6; }
.pd-fill { fill: none; stroke: var(--phase); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset .2s linear, stroke .4s; }
.pd-text { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; }
.pd-text b { font: 800 64px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.pd-text span { color: var(--muted); font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; margin-top: 4px; }
.player.is-paused .pd-text b { opacity: .45; }
.pl-ctrl { position: relative; flex: none; display: flex; align-items: center; justify-content: center; gap: 26px; padding: 8px 16px 6px; }
.pl-round { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); color: var(--text); }
.pl-round svg { width: 22px; height: 22px; }
.pl-main { width: 84px; height: 84px; border-radius: 50%; display: grid; place-content: center; justify-items: center; gap: 0; background: var(--phase); color: #06120C; box-shadow: 0 10px 30px color-mix(in srgb, var(--phase) 40%, transparent); transition: background .4s; }
.pl-main svg { width: 30px; height: 30px; }
.pl-main span { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
.pl-ctrl .btn-wide { max-width: 420px; }
.pl-extra { position: relative; flex: none; align-self: center; margin: 4px auto 12px; min-height: 44px; padding: 0 20px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; }
.pl-extra.pl-done { background: var(--ok); color: #04130C; border-color: var(--ok); min-height: 54px; padding: 0 28px; font-size: 17px; }
.pl-extra svg { width: 18px; height: 18px; }
.pl-sheet { position: absolute; inset: 0; z-index: 10; background: rgba(0, 0, 0, .55); display: flex; align-items: flex-end; animation: fade .2s; }
.sheet-card { width: 100%; background: var(--card); border-top: 1px solid var(--line); border-radius: 26px 26px 0 0; padding: 22px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; animation: sheetUp .28s cubic-bezier(.2, .8, .2, 1); }
.sheet-card h3 { font: 800 26px var(--display); text-transform: uppercase; }
.sheet-card p { color: var(--muted); margin-bottom: 6px; }
@keyframes sheetUp { from { transform: translateY(100%); } }
.pl-finish { display: grid; justify-items: center; text-align: center; gap: 8px; padding-top: 30px; }
.pf-badge { width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; background: var(--ok); color: #04130C; box-shadow: 0 12px 40px color-mix(in srgb, var(--ok) 45%, transparent); animation: pop .5s cubic-bezier(.2, 1.4, .4, 1); }
.pf-badge svg { width: 46px; height: 46px; }
.pl-finish h1 { font: 800 40px/1 var(--display); text-transform: uppercase; margin-top: 10px; }
.pl-finish p { color: var(--muted); font-weight: 600; }
.pl-finish .stats2 { width: 100%; margin-top: 16px; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }
@media (max-height: 740px) { .pl-stage .media-big { aspect-ratio: 16 / 9; } .pl-dial { width: min(44vw, 160px); } .pd-text b { font-size: 50px; } .pl-info h1 { font-size: 27px; } }

/* level picker */
.lvl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.lvl-btn { display: flex; align-items: center; justify-content: center; gap: 7px; min-height: 42px; padding: 0 8px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-weight: 700; font-size: 13.5px; color: var(--muted); text-align: center; }
.lvl-btn i { display: inline-flex; align-items: flex-end; gap: 2px; height: 13px; }
.lvl-btn i span { width: 3.5px; border-radius: 2px; background: currentColor; }
.lvl-btn i span:nth-child(1) { height: 5px; } .lvl-btn i span:nth-child(2) { height: 9px; } .lvl-btn i span:nth-child(3) { height: 13px; }
.lvl-btn.on { color: var(--gold); border-color: var(--gold); background: color-mix(in srgb, var(--gold) 10%, var(--card)); }
.lvl-note { text-align: left; margin-top: -8px; padding-inline: 2px; }

/* your own videos */
.media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
.media.has-video { background: #000; }
.media-tag i.v { background: var(--ok); }
.myvid { display: grid; gap: 10px; }
.mv-row { display: flex; gap: 10px; }
.mv-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.mv-btn { flex: 1; cursor: pointer; }
.mv-rm { flex: none; color: var(--danger); }
.mv-msg { text-align: left; padding-inline: 2px; }
.mv-input:focus-visible + .mv-btn { outline: 2.5px solid var(--gold); outline-offset: 2px; }

/* ===== Plan screen ===== */
.plan-set { display: grid; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 10px; }
.plan-set .seg { background: var(--bg2); border-color: transparent; }

.plan-set .lvl-btn.on { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 12%, var(--bg2)); }
.ps-note { color: var(--muted); font-size: 13px; padding: 0 6px 2px; }
.cycle { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 16px; display: grid; gap: 12px; }
.cycle .card-head { margin: 0; }
.cy-row { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.cy-row li { display: grid; gap: 2px; min-width: 0; }
.cy-bar { height: 6px; border-radius: 6px; background: var(--line); margin-bottom: 6px; }
.cy-row li.past .cy-bar { background: color-mix(in srgb, var(--gold) 45%, var(--line)); }
.cy-row li.now .cy-bar { background: linear-gradient(90deg, var(--gold2), var(--gold)); box-shadow: 0 0 12px color-mix(in srgb, var(--gold) 50%, transparent); }
.cy-row b { font: 700 13px var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--faint); }
.cy-name { font-size: 12.5px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cy-row li.now b { color: var(--gold); }
.cy-row li.now .cy-name { color: var(--text); }
.cy-note { font-size: 13.5px; color: var(--muted); padding-top: 10px; border-top: 1px solid var(--line); }
.list-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: -6px; padding-inline: 2px; }
.list-head span { color: var(--muted); font-size: 13px; font-weight: 600; }
.dcard { position: relative; display: flex; align-items: center; gap: 14px; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; transition: transform .12s; }
.dcard:active { transform: scale(.985); }
.dc-date { flex: none; width: 58px; height: 66px; border-radius: 16px; display: grid; place-content: center; justify-items: center; gap: 0; color: #fff; background: linear-gradient(160deg, var(--dA), var(--dB)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18); }
.dc-date b { font: 700 13px var(--display); letter-spacing: .1em; text-transform: uppercase; opacity: .9; }
.dc-date i { font: 800 28px/1 var(--display); font-style: normal; font-variant-numeric: tabular-nums; }
.dc-main { flex: 1; min-width: 0; display: grid; gap: 3px; }
.dc-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.dc-kind { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; background: var(--card2); color: var(--muted); }
.k-str { color: #FF8A73; background: rgba(255, 110, 88, .13); }
.k-cardio { color: #6E9BFF; background: rgba(110, 155, 255, .14); }
.k-full { color: var(--gold); background: color-mix(in srgb, var(--gold) 14%, transparent); }
.k-rec { color: #A894FF; background: rgba(168, 148, 255, .15); }
.dc-status { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; }
.dc-status svg { width: 12px; height: 12px; }
.dc-status.ok { background: var(--ok); color: #04130C; }
.dc-status.miss { background: var(--miss-soft); color: var(--miss); }
.dc-status.today { background: var(--gold); color: #1A1206; }
.dc-focus { font: 800 22px/1.05 var(--display); text-transform: uppercase; overflow-wrap: anywhere; }
.dc-meta { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 13px; font-weight: 600; flex-wrap: wrap; }
.dc-meta svg { width: 14px; height: 14px; }
.dc-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--faint); margin: 0 4px; }
.dc-fig { flex: none; width: 74px; }
.dc-fig .media-thumb { border-radius: 14px; }
.dcard.is-today { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 10px 26px color-mix(in srgb, var(--gold) 16%, transparent); }
.dcard.is-done .dc-focus { color: var(--muted); }
.dcard.is-past:not(.is-done) .dc-date { filter: saturate(.4); opacity: .75; }
@media (max-width: 360px) { .dc-fig { display: none; } }

/* ===== Plan timeline ===== */
.tl { list-style: none; margin: 0; padding: 0; position: relative; display: grid; gap: 12px; }
.tl::before { content: ''; position: absolute; left: 25px; top: 30px; bottom: 30px; width: 2px; background: linear-gradient(var(--line2), var(--line2)) ; border-radius: 2px; }
.tl-item { position: relative; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; align-items: start; }
.tl-node { position: relative; z-index: 1; width: 52px; height: 60px; margin-top: 10px; border-radius: 16px; display: grid; place-content: center; justify-items: center; color: #fff; background: linear-gradient(160deg, var(--dA), var(--dB)); box-shadow: 0 0 0 4px var(--bg), inset 0 1px 0 rgba(255, 255, 255, .2); }
.tl-node b { font: 700 11.5px var(--display); letter-spacing: .12em; text-transform: uppercase; opacity: .9; }
.tl-node i { font: 800 24px/1 var(--display); font-style: normal; font-variant-numeric: tabular-nums; display: grid; place-items: center; }
.tl-node i svg { width: 22px; height: 22px; }
.tl-item.is-past:not(.is-done) .tl-node { filter: saturate(.35); opacity: .7; }
.tl-item.is-done .tl-node { background: linear-gradient(160deg, #3DDC97, #138A5C); }
.tl-wrap { display: grid; gap: 8px; min-width: 0; }
.tl-card { position: relative; display: flex; align-items: stretch; gap: 10px; padding: 12px 10px 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; text-align: left; transition: transform .12s; }
.tl-card::before { content: ''; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0; background: linear-gradient(var(--dA), var(--dB)); }
.tl-card:active { transform: scale(.985); }
.tl-body { flex: 1; min-width: 0; display: grid; gap: 3px; align-content: center; }
.tl-ex { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-fig { flex: none; width: 72px; align-self: center; }
.tl-fig .media-thumb { border-radius: 14px; background: radial-gradient(110% 90% at 50% 20%, color-mix(in srgb, var(--dA) 30%, var(--stage-a)), var(--stage-b)); }
.tl-item.is-today .tl-card { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 12px 30px color-mix(in srgb, var(--gold) 16%, transparent); }
.tl-item.is-today .tl-node { box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px var(--gold); }
.tl-item.is-done .dc-focus { color: var(--muted); }
.tl-item.is-past:not(.is-done) .tl-card { opacity: .8; }
.tl-go { min-height: 46px; border-radius: 14px; }
.tl-go svg { width: 16px; height: 16px; }
@media (max-width: 360px) { .tl-fig { display: none; } }

.phase.tip b { color: var(--ok); }

/* ===== Brand & splash ===== */
.brandbar { display: flex; align-items: center; gap: 8px; padding-top: 10px; margin-bottom: -6px; }
.brandbar .logo { width: 26px; height: 26px; border-radius: 7px; }
.brandbar span { font: 800 16px var(--display); letter-spacing: .28em; color: var(--text); }
#splash { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 18px; background: radial-gradient(90% 60% at 50% 35%, #1A2130, #07090D 70%); transition: opacity .45s ease, transform .45s ease; }
#splash.gone { opacity: 0; transform: scale(1.04); pointer-events: none; }
#splash svg { width: 132px; height: 132px; overflow: visible; filter: drop-shadow(0 18px 40px rgba(246, 181, 71, .25)); }
#splash .sp-ring { stroke-dasharray: 2000; stroke-dashoffset: 2000; animation: spRing 1s cubic-bezier(.6, 0, .2, 1) .1s forwards; }
#splash .sp-f { opacity: 0; transform-origin: 512px 512px; animation: spF .5s cubic-bezier(.2, 1.4, .4, 1) .7s forwards; }
#splash .sp-word { font: 800 34px 'Barlow Condensed', 'Arial Narrow', sans-serif; letter-spacing: .42em; padding-left: .42em; color: #F3F5F9; opacity: 0; transform: translateY(10px); animation: spUp .5s ease .85s forwards; }
#splash .sp-tag { font: 600 13px 'Barlow', sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #8A93A6; opacity: 0; animation: spUp .5s ease 1s forwards; margin-top: -10px; }
@keyframes spRing { to { stroke-dashoffset: 0; } }
@keyframes spF { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
@keyframes spUp { to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #splash .sp-ring, #splash .sp-f, #splash .sp-word, #splash .sp-tag { animation: none; opacity: 1; stroke-dashoffset: 0; transform: none; } }

/* ===== Today additions ===== */
.hero-rest { background: linear-gradient(150deg, #3B3170, #141024); min-height: 240px; }
.hero-sub { font-size: 14.5px; opacity: .85; max-width: 34ch; margin-bottom: 4px; }
.btn-hero-ghost { width: 100%; background: rgba(255, 255, 255, .14); color: #fff; border: 1px solid rgba(255, 255, 255, .25); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.hero-links { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; }
.link-btn { color: inherit; opacity: .85; font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; padding: 6px 2px; text-align: center; }
.hero .link-btn { color: #fff; }
.wd.off i { background: transparent; border: 1.5px dashed var(--line2); color: var(--faint); }
.wd.made i { background: #6E9BFF; color: #06122B; }
.stat.streak b { color: var(--gold); }
.stats4 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stats4 .stat b { font-size: 40px; }

/* ===== Plan additions ===== */
.days-pick { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 6px 0; flex-wrap: wrap; }
.dp-label { font-size: 13.5px; font-weight: 700; color: var(--text); }
.dp-seg { display: flex; gap: 4px; background: var(--bg2); padding: 4px; border-radius: 12px; }
.dp-btn { width: 36px; height: 32px; border-radius: 9px; display: grid; place-items: center; font: 700 16px var(--display); color: var(--muted); text-align: center; }
.dp-btn.on { background: var(--gold); color: #1A1206; }
.tl-item.d-off .tl-node { background: var(--card2); color: var(--muted); box-shadow: 0 0 0 4px var(--bg); }
.tl-rest { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1.5px dashed var(--line2); border-radius: 20px; color: var(--muted); }
.tl-rest > span:nth-child(2) { flex: 1; display: grid; font-size: 13px; }
.tl-rest b { color: var(--text); font: 700 18px var(--display); text-transform: uppercase; letter-spacing: .02em; }
.tr-ico { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(142, 124, 240, .14); color: #A894FF; }
.tr-ico svg { width: 18px; height: 18px; }
.tl-acts { display: flex; gap: 8px; flex-wrap: wrap; }
.chip-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); font-size: 13px; font-weight: 700; color: var(--text); }
.chip-btn svg { width: 14px; height: 14px; color: var(--gold); }
.chip-btn:disabled { opacity: .4; }
.dc-status.made { background: rgba(110, 155, 255, .16); color: #6E9BFF; }

/* ===== Exercise: log + swap ===== */
.sw-tag { font-style: normal; font: 700 10px var(--body); letter-spacing: .06em; text-transform: uppercase; color: #6E9BFF; background: rgba(110, 155, 255, .14); padding: 2px 6px; border-radius: 6px; vertical-align: 3px; }
.logbox { display: grid; gap: 10px; }
.lg-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pb-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 700; color: var(--gold); background: color-mix(in srgb, var(--gold) 12%, transparent); padding: 4px 10px; border-radius: 99px; }
.pb-tag svg { width: 14px; height: 14px; }
.lg-table { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.lg-row { display: grid; grid-template-columns: 34px repeat(auto-fit, minmax(0, 1fr)); align-items: center; gap: 8px; padding: 8px 12px; }
.lg-row + .lg-row { border-top: 1px solid var(--line); }

.lg-in { width: 100%; min-width: 0; height: 40px; border-radius: 10px; border: 1px solid var(--line2); background: var(--bg2); color: var(--text); font: 700 17px var(--display); text-align: center; font-variant-numeric: tabular-nums; -moz-appearance: textfield; appearance: textfield; }

.swapbox { display: grid; gap: 4px; justify-items: center; }
.swapbox .btn svg { width: 18px; height: 18px; }
.swapbox .link-btn { color: var(--muted); }

/* ===== Sheets ===== */
.sheet-ov { position: absolute; inset: 0; z-index: 30; background: rgba(0, 0, 0, .55); display: flex; align-items: flex-end; animation: fade .2s; }
.sheet-ov.out { opacity: 0; transition: opacity .2s; }
.sheet-ov .sheet-card { max-height: 86%; overflow-y: auto; }
.sheet-grab { justify-self: center; width: 40px; height: 5px; border-radius: 5px; background: var(--line2); margin: -8px 0 4px; }
.sh-eyebrow { color: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.sh-sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 8px; }
.sh-sum span { background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: grid; font-size: 12px; color: var(--muted); }
.sh-sum b { font: 700 16px/1.15 var(--display); color: var(--text); text-transform: uppercase; }
.sh-log { display: grid; background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; }
.sh-lr { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; font-size: 14px; }
.sh-lr + .sh-lr { border-top: 1px solid var(--line); }
.sh-lr span:last-child { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.alt-list { display: grid; gap: 8px; }
.alt { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 16px; background: var(--bg2); border: 1px solid var(--line); text-align: left; }
.alt-th { width: 64px; flex: none; }
.alt-main { display: grid; min-width: 0; }
.alt-main b { font: 700 17px var(--display); text-transform: uppercase; }
.alt-main span { font-size: 12.5px; color: var(--muted); }

/* ===== Progress additions ===== */
.gc { border: 0; padding: 0; text-align: center; }
.gc.made { background: rgba(110, 155, 255, .2); color: #6E9BFF; }
.gc.rest { background: rgba(168, 148, 255, .12); color: #A894FF; }
.lg.made { background: rgba(110, 155, 255, .45); } .lg.rest { background: rgba(168, 148, 255, .35); }
.cal-tip { text-align: left; margin-top: 6px; padding: 0; }
.pbs { display: grid; gap: 2px; }
.pbs .card-head { margin-bottom: 6px; }
.pb-row { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--line); }

.pb-val { font: 800 20px var(--display); color: var(--gold); font-variant-numeric: tabular-nums; }
.pb-val small { font-size: 14px; color: var(--muted); }
.pb-date { font-size: 12px; color: var(--faint); min-width: 44px; text-align: right; }
.empty { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; padding: 6px 0 2px; }
.empty svg { width: 28px; height: 28px; color: var(--gold); flex: none; }
.backup { display: grid; gap: 10px; }

.bk-row { display: grid; grid-template-columns: 1.3fr 1fr; gap: 10px; }

.bk-row svg { width: 18px; height: 18px; }

/* ===== Feedback & finish ===== */
.fb-card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 16px; display: grid; gap: 8px; text-align: center; width: 100%; }
.fb-card h3 { font: 800 22px var(--display); text-transform: uppercase; }
.fb-card > p { color: var(--muted); font-size: 13.5px; }
.fb-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px; }
.fb-btn { display: grid; justify-items: center; gap: 4px; padding: 12px 6px; border-radius: 16px; background: var(--bg2); border: 1px solid var(--line); font-weight: 700; font-size: 13.5px; text-align: center; transition: transform .12s, border-color .2s; }
.fb-btn:active { transform: scale(.95); border-color: var(--gold); }
.fb-btn i { font-style: normal; font-size: 26px; line-height: 1; }
.fb-done { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--ok); font-weight: 600; font-size: 14.5px; }
.fb-done svg { width: 18px; height: 18px; flex: none; }
.pf-tiles { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.pf-tiles div { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px 6px; display: grid; justify-items: center; }
.pf-tiles b { font: 800 30px/1 var(--display); font-variant-numeric: tabular-nums; }
.pf-tiles span { color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-top: 4px; }
.pf-cmp { color: var(--muted); font-size: 14px; }

.pf-pbs { width: 100%; display: grid; gap: 4px; background: color-mix(in srgb, var(--gold) 10%, var(--card)); border: 1px solid color-mix(in srgb, var(--gold) 40%, transparent); border-radius: 18px; padding: 12px 14px; text-align: left; font-size: 14px; }
.pf-pbs b { display: flex; align-items: center; gap: 6px; color: var(--gold); font-weight: 800; }
.pf-pbs b svg { width: 16px; height: 16px; }
.pl-finish { gap: 10px; padding-bottom: 10px; }

.pl-log { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }

.tab:active svg { transform: scale(.88); }
.toast { max-width: calc(100% - 32px); }

.co-list li.ok i { background: var(--ok); border-color: var(--ok); color: #04130C; }
.co-list li i svg { width: 13px; height: 13px; }
.co-list li.co-foot { font-size: 12.5px; color: var(--faint); padding-left: 32px; }
.co-txt { color: var(--muted); font-size: 14px; }
.co-row { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; }
.co-badge { flex: none; width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: linear-gradient(160deg, var(--gold2), var(--gold)); color: #1A1206; box-shadow: 0 8px 22px color-mix(in srgb, var(--gold) 35%, transparent); }

.tm small { font-size: 11.5px; color: var(--faint); }

.pl-time .stp-v b { font-size: 26px; }
.t-adj { min-width: 0; padding-left: 10px; padding-right: 10px; }
.co-row { grid-template-columns: 1.7fr 1fr; }
.co-row .btn-primary { white-space: nowrap; padding-left: 10px; padding-right: 10px; }

.t-actions:has(.t-adj) { gap: 6px; }
.t-actions:has(.t-adj) .btn { flex: 1 1 auto; min-width: 0; padding-left: 8px; padding-right: 8px; }

/* ----- backup ----- */
function saveBackup() {
  var st = load(); st.lastBackup = iso(today()); save();
  var data = JSON.stringify({ app: 'forma', version: 1, saved: new Date().toISOString(), data: st }, null, 1);
  var name = 'Forma-backup-' + iso(today()) + '.json';
  var blob = new Blob([data], { type: 'application/json' });
  var done = function () { toast('Backup ready', 'Choose "Save to Files" to keep it safe.'); render('swap'); };
  try {
    var file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'Forma backup' }).then(done).catch(function () {});
      return;
    }
  } catch (e) {}
  try {
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000); done();
  } catch (e) { toast('Could not save backup', 'Please try again.'); }
}
function restoreBackup(f) {
  var r = new FileReader();
  r.onload = function () {
    var j; try { j = JSON.parse(r.result); } catch (e) { j = null; }
    var d = j && (j.data || j);
    if (!d || !d.start || !d.done) { toast('That file isn\'t a Forma backup', 'Pick the .json file you saved before.'); return; }
    openSheet(function (card, close) {
      card.appendChild(h('h3', '', 'Restore backup?'));
      card.appendChild(h('p', '', 'This replaces what\'s on this phone with your backup' + (j.saved ? ' from ' + fmtDate(new Date(j.saved), { day: 'numeric', month: 'short', year: 'numeric' }) : '') + ' (' + Object.keys(d.done).length + ' workouts).'));
      var y = h('button', 'btn btn-primary btn-wide', 'Restore'), n = h('button', 'btn btn-ghost btn-wide', 'Cancel');
      y.onclick = function () { mem = d; load(); save(); close(); render('swap'); toast('Backup restored', 'Welcome back!'); };
      n.onclick = close;
      card.appendChild(y); card.appendChild(n);
    });
  };
  r.readAsText(f);
}
